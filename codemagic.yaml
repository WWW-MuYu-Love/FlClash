# FlClash iOS port — Codemagic build config.
#
# Builds the unsigned FlClash iOS .ipa on Codemagic's free Mac mini M2
# runner. This is the working build line: builds #1 and #2 SUCCEEDED
# on this file (2026-11-10, repo WWW-MuYu-Love/FlClash). The .ipa is
# kept as a Codemagic build artifact for sideloading.
#
# TWO workflows:
#   1. flclash-ios (unsigned) — the baseline. Publishes the IPA to the
#      v<version>-ios GitHub Release via .github/publish_codemagic.sh
#      (needs GH_TOKEN; the script skips gracefully when it is unset).
#   2. flclash-ios-signed — STAGED TEMPLATE, commented out. Uncomment
#      only once the signing mechanism is decided (see the block below).
#      No App Store in either workflow.
#
# Toolchain (pinned per workflow): Flutter 3.47.9, Xcode 26.3. Go and
# Rust are installed by the scripts when missing (Go via brew, Rust via
# rustup + aarch64-apple-ios). The build follows the reference fork's
# flow: `dart setup.dart ios --no-codesign`
# (chenx-dust/FlClash-Patched, CI on macos-26).

workflows:
  flclash-ios:
    name: FlClash iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      # The default variable group, which holds GH_TOKEN (the secret
      # the publish step uses to upload the IPA to GitHub Releases).
      # Without this groups entry the workflow gets no variables from
      # the UI at all, so the publish step would see GH_TOKEN as unset
      # and skip the upload.
      groups:
        - default
      flutter: 3.47.9
      xcode: 26.3
      cocoapods: default
      # GH_TOKEN is an optional secret (default group): the publish step
      # uses it to upload the IPA to GitHub Releases, and skips the
      # upload when it is unset. No signing credentials, no App Store key.
    # No `triggering:` section on purpose: builds start MANUALLY from the
    # Codemagic UI or via the REST API only. Push auto-trigger would burn
    # the shared 500 min/month free allowance on every commit.
    # To enable push builds later, add:
    #   triggering:
    #     events:
    #       - push
    #     branch_patterns:
    #       - pattern: main
    #         include: true
    #     cancel_previous_builds: true
    # ...and set up the webhook (Codemagic UI: app > Webhooks, or the
    # GitHub App must have access to WWW-MuYu-Love/FlClash).
    scripts:
      - name: Init submodules
        script: |
          git submodule update --init --recursive
      - name: Toolchain versions
        script: |
          flutter --version
          dart --version
          xcodebuild -version
          go version || echo "Go NOT preinstalled — will install below"
          cargo --version || echo "Rust NOT preinstalled — will install below"
          rustc --version || true
      - name: Ensure Go 1.27.4 (hook builds the mihomo core with CGO)
        script: |
          # core/go.mod requires go 1.27.0 and mitmproxy-go needs Go >= 1.27.3.
          # Homebrew's go tracks the current stable (1.27.4); install it when
          # missing and upgrade it when an older one is present, so the build
          # never silently uses a stale toolchain.
          if command -v go >/dev/null 2>&1; then
            brew upgrade go || true
          else
            brew install go
          fi
          go version
          # Fail loudly on a Go older than 1.27.3 instead of breaking later
          # in the core build.
          GO_MINOR=$(go version | sed -E 's/.*go1\.([0-9]+)\.[0-9]+.*/\1/')
          GO_PATCH=$(go version | sed -E 's/.*go1\.[0-9]+\.([0-9]+).*/\1/')
          if [ "$GO_MINOR" -lt 27 ] || { [ "$GO_MINOR" -eq 27 ] && [ "$GO_PATCH" -lt 3 ]; }; then
            echo "Go >= 1.27.3 required, found $(go version)"
            exit 1
          fi
      - name: Ensure Rust (hook builds the Rust helper for iOS)
        script: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          cargo --version
          rustc --version
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Build unsigned iOS IPA
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # setup.dart downloads GeoData, writes env.json, runs the Flutter
          # iOS build (the Dart build hook compiles the Go core + Rust
          # helper), and packages the .ipa via flutter_distributor.
          # --no-codesign: arm64 device IPA, no provisioning/certificate.
          # Bundle ID comes from the Xcode project in the repo; pass
          # --ios-bundle-id <id> here only if the first build complains
          # about a missing/placeholder bundle ID.
          dart setup.dart ios --no-codesign
          echo "--- dist/ contents ---"
          find dist -type f | head -50
      - name: Stage IPA artifact
        script: |
          IPA_PATH=$(find dist -name '*.ipa' | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: no .ipa found under dist/ — see previous step's listing"
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" ./FlClash-unsigned.ipa
          ls -lh FlClash-unsigned.ipa
      - name: Publish to GitHub Releases
        script: |
          bash .github/publish_codemagic.sh
    artifacts:
      - FlClash-unsigned.ipa

